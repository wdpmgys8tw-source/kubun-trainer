<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2588e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>区分トレーナー</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#173759;background:#f1f8ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(165deg,#e5f5ff,#f7fbff 60%)}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.98)}.app{max-width:600px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}.top{display:flex;align-items:center;min-height:46px;gap:12px}.back{background:none;border:0;color:#2273b6;font-weight:700;padding:10px 0}.top h2{font-size:22px;margin:0}.content{flex:1;display:flex;flex-direction:column;gap:16px}.home{justify-content:center;text-align:center}.home .symbol{font-size:60px}.home h1{font-size:38px;color:#147ad4;margin:0}.subtitle{color:#6484a1;margin:0 0 24px}.btn{border:0;border-radius:18px;padding:17px 18px;font-size:19px;font-weight:800;min-height:60px;box-shadow:0 4px 0 #0000000c}.primary{background:#2588e8;color:white}.secondary{background:#fff;color:#2375bf;border:2px solid #b8ddfa}.danger{background:#fff;color:#d43d4d;border:2px solid #ffd0d5}.item{width:100%;text-align:left;background:white;border:2px solid #d7eafa;color:#245578;border-radius:17px;padding:18px;font-size:19px;font-weight:750}.item:after{content:"›";float:right;color:#74a9d2}.muted{color:#6b88a2;font-size:14px}.label{font-size:16px;font-weight:800;margin-bottom:8px}.field{width:100%;padding:15px;border-radius:14px;border:2px solid #d0e6f7;background:#fff;color:#173759;font-size:18px;outline:none}.field:focus{border-color:#2588e8}textarea.field{min-height:210px;resize:vertical;line-height:1.6}.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 28px #4a99cf13}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{border:2px solid #cce5f9;border-radius:14px;padding:14px 4px;background:#fff;color:#3474a7;font-weight:800}.choice.selected{background:#2588e8;border-color:#2588e8;color:#fff}.spacer{flex:1}.ready{align-items:center;justify-content:center}.start{width:min(66vw,280px);height:min(66vw,280px);border-radius:50%;border:10px solid #b9e4ff;background:#2588e8;color:white;font-size:42px;font-weight:900;box-shadow:0 12px 30px #2687d34a}.center{align-items:center;justify-content:center;text-align:center}.count{font-size:clamp(130px,45vw,230px);font-weight:900;color:#2387e9}.practice{position:relative;user-select:none;touch-action:manipulation}.practiceHead{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#5988b1;min-height:55px}.end{border:0;background:#fff;border-radius:12px;color:#bd5261;padding:12px 18px;font-weight:800}.destination{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:15px 0;line-height:1.18;font-weight:900;color:#123e67}.destination .destInner{width:100%;overflow-wrap:anywhere}.destination .destLine{display:block;white-space:nowrap;overflow-wrap:normal;word-break:keep-all}.finish{font-size:50px;color:#2588e8;font-weight:900}.time{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums}.dialogShade{position:fixed;inset:0;background:#183f65a8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.dialog{width:min(100%,380px);background:white;border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;text-align:center}.dialog h3{margin:0 0 12px;font-size:21px}.error{color:#c33948;font-weight:700;font-size:14px}.stack{display:flex;flex-direction:column;gap:12px}.footerNote{text-align:center;font-size:12px;color:#87a2ba;margin-top:16px}@media(prefers-reduced-motion:no-preference){.start{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 12px 42px #2687d36b}}}
</style></head><body><main id="app" class="app"></main><script>
(()=>{'use strict';
const STORAGE='kubun-trainer-sets-v1';let sets=load(),page='home',selected=null,mode='manual',count=50,interval=1000,sequence=[],index=0,startedAt=0,pausedMs=0,pauseAt=0,elapsed=0,runTimer=null,dialog=null,editId=null;
const app=document.getElementById('app');const el=(tag,cls,text)=>{let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};const add=(p,...kids)=>{kids.forEach(k=>p.append(k));return p};const btn=(label,cls,fn)=>{let b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b};function load(){try{let v=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(v)?v.filter(s=>s&&typeof s.name==='string'&&Array.isArray(s.items)):[]}catch{return []}}function save(){localStorage.setItem(STORAGE,JSON.stringify(sets))}function clearTimer(){if(runTimer!==null){clearTimeout(runTimer);runTimer=null}}function go(p){clearTimer();dialog=null;page=p;render()}function header(title,back){let h=el('div','top');add(h,btn('‹ 戻る','back',back),el('h2','',title));return h}function content(){return el('div','content')}function render(){app.replaceChildren();if(page==='home')return home();if(page==='select')return select();if(page==='settings')return settings();if(page==='ready')return ready();if(page==='countdown')return countdownView();if(page==='practice')return practiceView();if(page==='finish')return finishView();if(page==='manage')return manage();if(page==='edit')return editView()}function home(){let c=content();c.classList.add('home');add(c,el('div','symbol','📬'),el('h1','','区分トレーナー'),el('p','subtitle','区分先を、もっと速く。もっと正確に。'),btn('練習する','btn primary',()=>go('select')),btn('セット管理','btn secondary',()=>go('manage')));add(app,c,el('p','footerNote','練習データはこの端末に保存されます'))}function select(){app.append(header('セットを選択',()=>go('home')));let c=content();if(!sets.length){add(c,el('p','muted','まだセットがありません。セット管理から作成してください。'),btn('セット管理へ','btn primary',()=>go('manage')))}else sets.forEach(s=>c.append(btn(s.name,'item',()=>{selected=s.id;count=50;mode='manual';interval=1000;go('settings')})));app.append(c)}function current(){return sets.find(s=>s.id===selected)}function settings(){if(!current())return go('select');app.append(header('練習設定',()=>go('select')));let c=content(),p=el('div','panel stack');let block=el('div');add(block,el('div','label','通数'));let num=el('input','field');num.type='number';num.min='1';num.max='10000';num.inputMode='numeric';num.value=count;num.addEventListener('input',()=>{count=Number(num.value)});block.append(num);p.append(block);p.append(el('div','label','モード'));let modes=el('div','choices');['manual','auto'].forEach((m,i)=>modes.append(btn(i?'自動':'手動','choice'+(mode===m?' selected':''),()=>{mode=m;go('settings')})));p.append(modes);if(mode==='auto'){p.append(el('div','label','表示間隔'));let choices=el('div','choices four');[800,1000,1500,2000].forEach(ms=>choices.append(btn((ms/1000).toFixed(1)+'秒','choice'+(interval===ms?' selected':''),()=>{interval=ms;go('settings')})));p.append(choices)}let error=el('div','error');add(c,p,error);c.append(el('div','spacer'));c.append(btn('練習開始へ','btn primary',()=>{let v=Number(num.value);if(!Number.isInteger(v)||v<1||v>10000){error.textContent='通数は1～10000の整数で入力してください';return}count=v;go('ready')}));app.append(c)}function ready(){app.append(header('準備',()=>go('settings')));let c=content();c.classList.add('ready');add(c,el('p','muted','準備ができたらタップ'),btn('START','start',startCountdown));app.append(c)}function startCountdown(){const s=current();if(!s||!s.items.length)return go('select');sequence=[];let last=-1;for(let i=0;i<count;i++){let next=0;if(s.items.length>1){next=Math.floor(Math.random()*(s.items.length-1));if(next>=last)next++}sequence.push(s.items[next]);last=next}index=0;elapsed=0;pausedMs=0;page='countdown';render();let n=3;function tick(){if(page!=='countdown')return;n--;if(n===0){startedAt=performance.now();page='practice';render();if(mode==='auto')scheduleAuto();return}let node=document.getElementById('counter');if(node)node.textContent=n;runTimer=setTimeout(tick,1000)}runTimer=setTimeout(tick,1000)}function countdownView(){let c=content();c.classList.add('center');add(c,el('div','count','3'));c.lastChild.id='counter';app.append(c)}function practiceView(){let c=content();c.classList.add('practice');let h=el('div','practiceHead');add(h,btn('終了','end',askEnd),el('span','',String(index+1)+'/'+count));let dest=el('div','destination'),inner=el('div','destInner');String(sequence[index]??'').split('/').forEach(line=>inner.append(el('span','destLine',line)));dest.append(inner);c.append(h,dest);if(mode==='manual')dest.addEventListener('click',advance);app.append(c);requestAnimationFrame(()=>{if(page!=='practice')return;const spans=[...inner.children];const maxHeight=Math.max(50,dest.clientHeight-30);let size=Math.min(155,Math.floor(maxHeight/(Math.max(1,spans.length)*1.2)));inner.style.fontSize=size+'px';const availableWidth=Math.max(50,dest.clientWidth-16);for(let attempts=0;attempts<140;attempts++){if(inner.scrollWidth<=availableWidth&&spans.every(span=>span.scrollWidth<=availableWidth)&&inner.scrollHeight<=maxHeight)break;size=Math.max(16,size-1);inner.style.fontSize=size+'px';if(size===16)break}})}function advance(){if(dialog||page!=='practice')return;if(index+1>=count){elapsed=performance.now()-startedAt-pausedMs;go('finish')}else{index++;render()}}function scheduleAuto(){clearTimer();runTimer=setTimeout(()=>{if(page!=='practice'||dialog)return;if(index+1>=count){go('finish')}else{index++;render();scheduleAuto()}},interval)}function askEnd(){if(dialog)return;clearTimer();pauseAt=performance.now();dialog='end';let shade=el('div','dialogShade'),d=el('div','dialog');add(d,el('h3','','練習を終了しますか？'),btn('続ける','btn primary',()=>{pausedMs+=performance.now()-pauseAt;shade.remove();dialog=null;if(mode==='auto')scheduleAuto()}),btn('終了する','btn danger',()=>go('select')));shade.append(d);document.body.append(shade)}function finishView(){let c=content();c.classList.add('center');add(c,el('div','finish','FINISH!'));if(mode==='manual'){let t=Math.floor(elapsed/10),mins=Math.floor(t/6000),secs=Math.floor(t%6000/100),cent=t%100;c.append(el('div','time',mins+':'+String(secs).padStart(2,'0')+'.'+String(cent).padStart(2,'0')))}add(c,btn('もう一度','btn primary',()=>go('ready')),btn('終了','btn secondary',()=>go('select')));app.append(c)}function manage(){app.append(header('セット管理',()=>go('home')));let c=content();c.append(btn('＋ 新しいセットを作る','btn primary',()=>{editId=null;go('edit')}));sets.forEach(s=>c.append(btn(s.name,'item',()=>{editId=s.id;go('edit')})));app.append(c)}function editView(){let old=sets.find(s=>s.id===editId);app.append(header(old?'セット編集':'セット新規登録',()=>go('manage')));let c=content(),p=el('div','panel stack');p.append(el('div','label','セット名'));let name=el('input','field');name.placeholder='例：Aサイド';name.value=old?.name||'';p.append(name);p.append(el('div','label','区分先'));p.append(el('div','muted','1行に1件入力　「/」で表示を改行'));let ta=el('textarea','field');ta.placeholder='100\n101\n中央/104\n江東区';ta.value=old?.items.join('\n')||'';p.append(ta);let error=el('div','error');add(c,p,error);c.append(btn('保存する','btn primary',()=>{let nm=name.value.trim(),items=ta.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!nm){error.textContent='セット名を入力してください';return}if(!items.length){error.textContent='区分先を1件以上入力してください';return}if(old){old.name=nm;old.items=items}else sets.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name:nm,items});try{save();go('manage')}catch{error.textContent='保存できませんでした。端末の空き容量やブラウザ設定を確認してください'}}));if(old){c.append(el('div','spacer'));c.append(btn('セットを削除','btn danger',()=>{let shade=el('div','dialogShade'),d=el('div','dialog');add(d,el('h3','', '「'+old.name+'」を削除しますか？'),btn('キャンセル','btn primary',()=>shade.remove()),btn('削除する','btn danger',()=>{sets=sets.filter(s=>s.id!==old.id);save();shade.remove();go('manage')}));shade.append(d);document.body.append(shade)}))}app.append(c)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&page==='practice'&&!dialog)askEnd()});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
