</style></head><body><main id="app" class="app"></main><script>
(()=>{'use strict';
const STORAGE='kubun-trainer-sets-v1';let sets=load(),page='home',selected=null,mode='manual',count=50,interval=1000,sequence=[],index=0,startedAt=0,pausedMs=0,pauseAt=0,elapsed=0,runTimer=null,dialog=null,editId=null;
const SOUND_KEY='kubun-trainer-sound-v1';let soundOn=true,audioCtx=null;try{soundOn=localStorage.getItem(SOUND_KEY)!=='off'}catch{}function tone(freq,duration=0.16,kind='ding',delay=0){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);if(kind==='ding')o.frequency.exponentialRampToValueAtTime(freq*1.16,t+0.045);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.13,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+0.01)}catch{}}function sound(kind){if(kind==='count')tone(760,0.11,'flat');else if(kind==='start'){tone(880,0.22);tone(1320,0.27,'ding',0.09)}else if(kind==='finish'){tone(784,0.17);tone(988,0.19,'ding',0.12);tone(1318,0.38,'ding',0.25)}else tone(1047,0.16)}document.addEventListener('click',e=>{if(e.target.closest('button:not(:disabled)'))sound('tap')},true);function toggleSound(){soundOn=!soundOn;try{localStorage.setItem(SOUND_KEY,soundOn?'on':'off')}catch{}render();if(soundOn)sound('tap')}const app=document.getElementById('app');const el=(tag,cls,text)=>{let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};const add=(p,...kids)=>{kids.forEach(k=>p.append(k));return p};const btn=(label,cls,fn)=>{let b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b};function load(){try{let v=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(v)?v.filter(s=>s&&typeof s.name==='string'&&Array.isArray(s.items)):[]}catch{return []}}function save(){localStorage.setItem(STORAGE,JSON.stringify(sets))}function clearTimer(){if(runTimer!==null){clearTimeout(runTimer);runTimer=null}}function go(p){clearTimer();d d(el('div','label','表示間隔'));let choices=el('div','choices four');[800,1000,1500,2000].forEach(ms=>choices.append(btn((ms/1000).toFixed(1)+'秒','choice'+(interval===ms?' selected':''),()=>{interval=ms;go('settings')})));p.append(choices)}let error=el('div','error');add(c,p,error);c.append(el('div','spacer'));c.append(btn('練習開始へ','btn primary',()=>{let v=Number(num.value);if(!Number.isInteger(v)||v<1||v>10000){error.textContent='通数は1～10000の整数で入力してください';return}count=v;go('ready')}));app.append(c)}function ready(){app.append(header('準備',()=>go('settings')));let c=content();c.classList.add('ready');add(c,el('p','muted','準備ができたらタップ'),btn('START','start',startCountdown));app.append(c)}function startCountdown(){const s=current();if(!s||!s.items.length)return go('select');sequence=[];let last=-1;for(let i=0;i<count;i++){let next=0;if(s.items.length>1){next=Math.floor(Math.random()*(s.items.length-1));if(next>=last)next++}sequence.push(s.items[next]);last=next}index=0;elapsed=0;pausedMs=0;page='countdown';render();sound('count');let n=3;function tick(){if(page!=='countdown')return;n--;if(n===0){sound('start');startedAt=performance.now();page='practice';render();if(mode==='auto')scheduleAuto();return}let node=document.getElementById('counter');if(node)node.textContent=n;sound('count');runTimer=setTimeout(tick,1000)}runTimer=setTimeout(tick,1000)}function countdownView(){let c=content();c.classList.add('center');add(c,el('div','count','3'));c.lastChild.id='counter';app.append(c)}function practiceView(){let c=content();c.classList.add('practice');let h=el('div','practiceHead');add(h,btn('終了','end',askEnd),el('span','',String(index+1)+'/'+count));let dest=el('div','destination'),inner=el('div','destInner');String(sequence[index]??'').split('/').forEach(line=>inner.append(el('span','destLine',line)));dest.append(inner);c.append(h,dest);if(mode==='manual')dest.addEventListener('click',advance);app.append(c);requestAnimationFrame(()=>{if(page!=='practice')return;const lines=String(sequence[index]??'').split('/');const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');ctx.font='900 100px -apple-system, BlinkMacSystemFont, sans-serif';const widest=Math.max(1,...lines.map(line=>ctx.measureText(line).width));const width=Math.max(50,dest.clientWidth-30);const height=Math.max(50,dest.clientHeight-30);const fontSize=Math.max(18,Math.min(155,Math.floor(width*100/widest),Math.floor(height/(Math.max(1,lines.length)*1.3))));inner.style.fontSize=Math.max(14,Math.floor(fontSize*0.8))+'px';})}function advance(){if(dialog||page!=='practice')return;if(index+1>=count){elapsed=performance.now()-startedAt-pausedMs;go('finish')}else{index++;render()}}function scheduleAuto(){clearTimer();runTimer=setTimeout(()=>{if(page!=='practice'||dialog)return;if(index+1>=count){go('finish')}else{index++;render();scheduleAuto()}},interval)}function askEnd(){if(dialog)return;clearTimer();pauseAt=performance.now();dialog='end';let shade=el('div','dialogShade'),d=el('div','dialog');add(d,el('h3','','練習を終了しますか？'),btn('続ける','btn primary',()=>{pausedMs+=performance.now()-pauseAt;shade.remove();dialog=null;if(mode==='auto')scheduleAuto()}),btn('終了する','btn danger',()=>go('select')));shade.append(d);document.body.append(shade)}function finishView(){sound('finish');let c=content();c.classList.add('center');add(c,el('div','finish','FINISH!'));if(mode==='manual'){let t=Math.floor(elapsed/10),mins=Math.floor(t/6000),secs=Math.floor(t%6000/100),cent=t%100;c.append(el('div','time',mins+':'+String(secs).padStart(2,'0')+'.'+String(cent).padStart(2,'0')))}add(c,btn('もう一度','btn primary',()=>go('ready')),btn('終了','btn secondary',()=>go('select')));app.append(c)}function manage(){app.append(header('セット管理',()=>go('home')));let c=content();c.append(btn('＋ 新しいセットを作る','btn primary',()=>{editId=null;go('edit')}));sets.forEach((s,i)=>{let row=el('div','setRow');row.append(btn(s.name,'item',()=>{editId=s.id;go('edit')}));let controls=el('div','setOrder');let up=btn('↑','orderBtn',()=>moveSet(i,-1)),down=btn('↓','orderBtn',()=>moveSet(i,1));up.disabled=i===0;down.disabled=i===sets.length-1;up.setAttribute('aria-label',s.name+'を上へ移動');down.setAttribute('aria-label',s.name+'を下へ移動');controls.append(up,down);row.append(controls);c.append(row)});app.append(c)}function moveSet(i,d){let j=i+d;if(j<0||j>=sets.length)return;[sets[i],sets[j]]=[sets[j],sets[i]];try{save();render()}catch{[sets[i],sets[j]]=[sets[j],sets[i]];alert('並び順を保存できませんでした。端末の空き容量やブラウザ設定を確認してください')}}function editView(){let old=sets.find(s=>s.id===editId);app.append(header(old?'セット編集':'セット新規登録',()=>go('manage')));let c=content(),p=el('div','panel stack');p.append(el('div','label','セット名'));let name=el('input','field');name.placeholder='例：Aサイド';name.value=old?.name||'';p.append(name);p.append(el('div','label','区分先'));p.append(el('div','muted','1行に1件入力　「/」で表示を改行'));let ta=el('textarea','field');ta.placeholder='100\n101\n中央/104\n江東区';ta.value=old?.items.join('\n')||'';p.append(ta);let error=el('div','error');add(c,p,error);c.append(btn('保存する','btn primary',()=>{let nm=name.value.trim(),items=ta.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!nm){error.textContent='セット名を入力してください';return}if(!items.length){error.textContent='区分先を1件以上入力してください';return}if(old){old.name=nm;old.items=items}else sets.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name:nm,items});try{save();go('manage')}catch{error.textContent='保存できませんでした。端末の空き容量やブラウザ設定を確認してください'}}));if(old){c.append(el('div','spacer'));c.append(btn('セットを削除','btn danger',()=>{let shade=el('div','dialogShade'),d=el('div','dialog');add(d,el('h3','', '「'+old.name+'」を削除しますか？'),btn('キャンセル','btn primary',()=>shade.remove()),btn('削除する','btn danger',()=>{sets=sets.filter(s=>s.id!==old.id);save();shade.remove();go('manage')}));shade.append(d);document.body.append(shade)}))}app.append(c)}document.addEventListener('visibilitychange',()=>{if(document.hidden&&page==='practice'&&!dialog)askEnd()});render();if('serviceWorker'in navi
